name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      radar-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: radar-test
          POSTGRES_DB: radar_budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generated n8n workflow
        run: npm run radar:n8n:check

      - name: Test
        run: npm test

      - name: Radar database regression
        run: npm run test:radar-db

      - name: Radar budget concurrent reservations (isolated PostgreSQL)
        env:
          RADAR_TEST_PG_URL: postgresql://postgres:radar-test@localhost:5432/radar_budget_test
        run: node supabase/tests/run-radar-budget-concurrency.mjs

      - name: Build
        run: npm run build

      - name: Block critical dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
